    <script>
      (function () {
        try {
          window.addEventListener(
            'error',
            function (event) {
              var src = (event && event.filename) || '';
              var msg = (event && event.message) || '';
              if (
                src.indexOf('chrome-extension://') === 0 ||
                src.indexOf('moz-extension://') === 0 ||
                msg.indexOf('chrome-extension://') !== -1
              ) {
                event.preventDefault();
                event.stopImmediatePropagation();
              }
            },
            true
          );

          var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          var protoDesc =
            typeof Window !== 'undefined' && Window.prototype
              ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')
              : undefined;
          var activeDesc = ownDesc || protoDesc;

          if (
            activeDesc &&
            !activeDesc.writable &&
            typeof activeDesc.get === 'function' &&
            !activeDesc.set &&
            (!ownDesc || ownDesc.configurable)
          ) {
            var originalGet = activeDesc.get;
            var assignedFetch = null;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: activeDesc.enumerable !== false,
              get: function () {
                return assignedFetch || originalGet.call(window);
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  assignedFetch = nextFetch;
                }
              },
            });
          }
        } catch (_err) {
          // Ignore non-configurable host descriptors
        }
      })();
    </script>
